# Pre-commit hooks for compile-lens. Install with:
#   pip install pre-commit && pre-commit install
# That single command installs both the pre-commit and pre-push stages
# because of `default_install_hook_types` below.
# Run on the whole tree:
#   pre-commit run --all-files
#
# Design notes:
#   - The Rust hooks shell out to the workspace's own `cargo` (language: system).
#     We *do not* fetch a separate clippy binary from a pre-commit mirror — the
#     workspace already pins a Rust toolchain via `rust-toolchain.toml` (or the
#     contributor's stable channel), and that is the toolchain the CI uses too.
#     Anything else risks "clippy passes locally, fails in CI".
#   - Ruff is split into lint (with --fix) and format, mirroring how CI calls it.
#   - Hook rev pins are immutable refs; bump them via Dependabot or a manual PR.

default_install_hook_types: [pre-commit, pre-push]
default_language_version:
  python: python3

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Pinned to match the `ruff` the dev env / CI install (pyproject `ruff>=0.6` resolves to
    # 0.15.x). Keeping the hook on an old rev made pre-commit and `cargo`-side preflight disagree
    # on formatting and lint rules; align both to one version. Bump in lockstep with the dev pin.
    rev: v0.15.14
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt --check
        entry: cargo fmt --all -- --check
        language: system
        types: [rust]
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy -D warnings
        entry: cargo clippy --workspace --all-targets -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
      - id: no-private-fingerprints
        name: no private planning identifiers in repo files
        entry: scripts/check_private_fingerprints.sh
        language: system
        # Run on every text file the developer touches; the script's own
        # whitelist exempts the files that exist to describe the rule.
        types: [text]
        exclude: '^(Cargo\.lock|target/|\.git/)'

      - id: branch-advances-main
        name: branch has at least one commit beyond main
        entry: scripts/check_branch_advances.sh
        language: system
        stages: [pre-push]
        # The script reads the local repo state, not file lists.
        pass_filenames: false
        always_run: true
