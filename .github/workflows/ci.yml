name: CI

on:
  pull_request:
  push:
    branches: [main]

# A re-push to the same branch cancels the previous in-flight run; the most
# recent commit is the one we care about. Pushes to main are *not* cancelled
# (the second clause keeps `cancel-in-progress` false on main).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt-clippy:
    name: Rust fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  algorithmic-invariant:
    name: Algorithmic invariants (release blocker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Release-blocker correctness invariants (design D7). They also run inside
      # `cargo test --workspace` in the test job; this dedicated job exists to make the gate visible —
      # a red check here unambiguously means "do not release".
      #
      # compile-diff (Tool 2a): operand-order handling, match coverage on real model graphs, and
      # matching precision on the gold corpus.
      - run: >
          cargo test -p cls-wl-diff
          --test operand_order_regression
          --test coverage_benchmark
          --test gold_precision
      # kernel-roofline (Tool 5): the rank-correlation pruning gate is sound — prune only when the
      # predicted ranking tracks the measured one, fall back to a full sweep otherwise.
      - run: cargo test -p cls-roofline --test rank_correlation_invariant
      # cls-scrub: the share-time redaction must produce byte-identical, share-safe output and must
      # never let a flagged secret survive (fuzz). A red check here means a scrub regressed and the
      # release would leak.
      - run: cargo test -p cls-scrub --test corpus

  ruff-mypy:
    name: Python lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check python/
      - run: mypy python/compile_lens

  test:
    name: Test (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pip install -e ".[dev]"
      # CPU torch so the torch-gated runtime-layer tests actually run here instead of skipping
      # (Tool 3 divergence, Layer-2 lint, artifact capture). pip cache (above) amortizes the wheel.
      - name: install CPU torch (runtime-layer tests)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: cargo test --workspace
      - run: pytest python/tests
      # All integration suites: the cross-language round-trip plus the Tool 1/5/6 end-to-end
      # pipelines (Python collector/capture -> Rust `cl` analyzer over the subprocess boundary).
      # tool6 captures via torch.compile, so it needs the CPU torch installed above.
      - name: integration (cross-language + Tool 1/5/6 end-to-end)
        run: pytest tests/integration/

  determinism:
    name: Determinism (round-trip suite ×2)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pip install -e ".[dev]"
      # Per-test byte-equality is asserted inside the round-trip suite. Running the
      # whole suite twice at the job level surfaces nondeterminism that escapes
      # per-test isolation (e.g. global state, env-dependent ordering).
      - run: pytest tests/integration/test_schema_round_trip.py
      - run: pytest tests/integration/test_schema_round_trip.py

  migration:
    name: Migration (current-version byte-copy + dry-run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: migrate current-version artifact and cmp
        run: |
          cargo run -q -p cls-cli -- migrate schema/examples/full.cls.json --output /tmp/out.json
          cmp schema/examples/full.cls.json /tmp/out.json
      - name: dry-run reports current schema version
        run: |
          cargo run -q -p cls-cli -- migrate schema/examples/full.cls.json --dry-run | grep -q "0.5.0"

  tracing:
    name: Tracing (CLS_LOG / CLS_LOG_FORMAT contract)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build cls-cli
        run: cargo build -q -p cls-cli
      - name: default level is silent (no DEBUG events leak)
        run: |
          out=$(./target/debug/cl --version 2>&1)
          if echo "$out" | grep -q DEBUG; then
            echo "ERROR: DEBUG event at default (warn) level"; echo "$out"; exit 1
          fi
      - name: CLS_LOG=debug surfaces DEBUG events
        env:
          CLS_LOG: debug
        run: ./target/debug/cl --version 2>&1 | grep -q DEBUG
      - name: CLS_LOG_FORMAT=json + CLS_LOG=info emits a JSON-shaped event
        env:
          CLS_LOG: info
          CLS_LOG_FORMAT: json
        run: ./target/debug/cl --version 2>&1 | grep -q '"level":"INFO"'

  fingerprint:
    name: Private fingerprint sweep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Run the same hook that guards commits, across every tracked source file, so a push that
      # bypassed the local pre-commit hooks cannot slip an internal planning identifier into the
      # public repo (ADR-028). Single-sourced: the patterns and whitelist live in the hook script.
      - name: scan tracked files for internal planning identifiers
        run: git ls-files -z -- '*.md' '*.rs' '*.py' '*.toml' '*.yml' | xargs -0 bash scripts/check_private_fingerprints.sh
