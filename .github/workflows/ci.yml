name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt-clippy:
    name: Rust fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  ruff-mypy:
    name: Python lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check python/
      - run: mypy python/compile_lens

  test:
    name: Test (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pip install -e ".[dev]"
      - run: cargo test --workspace
      - run: pytest python/tests
      - name: cross-language round-trip
        run: pytest tests/integration/test_schema_round_trip.py

  determinism:
    name: Determinism (round-trip suite ×2)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pip install -e ".[dev]"
      # Per-test byte-equality is asserted inside the round-trip suite. Running the
      # whole suite twice at the job level surfaces nondeterminism that escapes
      # per-test isolation (e.g. global state, env-dependent ordering).
      - run: pytest tests/integration/test_schema_round_trip.py
      - run: pytest tests/integration/test_schema_round_trip.py

  migration:
    name: Migration (current-version byte-copy + dry-run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: migrate current-version artifact and cmp
        run: |
          cargo run -q -p cls-cli -- migrate schema/examples/full.cls.json --output /tmp/out.json
          cmp schema/examples/full.cls.json /tmp/out.json
      - name: dry-run reports current schema version
        run: |
          cargo run -q -p cls-cli -- migrate schema/examples/full.cls.json --dry-run | grep -q "0.5.0"
