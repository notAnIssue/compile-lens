[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "compile-lens"
version = "0.5.0"
description = "Diagnostic suite for torch.compile production observability (recompile / regression / divergence / lint / kernel triage)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "BSD-3-Clause" }
authors = [{ name = "compile-lens maintainers" }]
keywords = ["pytorch", "torch.compile", "inductor", "triton", "diagnostics", "observability"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Rust",
    "License :: OSI Approved :: BSD License",
    "Topic :: Software Development :: Debuggers",
]

# Core runtime deps are intentionally light. PyTorch is NOT a hard dependency:
# the user brings their own torch (a torch.compile workload already has it), and
# pinning it here would risk version conflicts and a ~2 GB install (see design note).
# Heavier ecosystem integrations (tlparse / triton / proton) become extras as they land.
dependencies = [
    "pydantic>=2.0",
    "structlog>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy>=1.11",
    "ruff>=0.6",
    "pre-commit>=4.0",
]

[project.scripts]
cl = "compile_lens.cli:main"
compile-lens = "compile_lens.cli:main"

[project.urls]
Repository = "https://github.com/notAnIssue/compile-lens"

# The Python package lives under python/ (the Rust workspace owns the repo root).
[tool.hatch.build.targets.wheel]
packages = ["python/compile_lens"]

[tool.ruff]
line-length = 100
src = ["python"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
files = ["python/compile_lens"]
disallow_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
warn_return_any = true
