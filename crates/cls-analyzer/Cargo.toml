[package]
name = "cls-analyzer"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
cls-correctness-db = { path = "../cls-correctness-db" }
cls-errors = { path = "../cls-errors" }
cls-roofline = { path = "../cls-roofline" }
cls-schema = { path = "../cls-schema" }
indexmap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# Bench-only. default-features = false drops criterion's HTML-report machinery
# (plotters / rayon / csv) we don't use — we only need the timing harness (ADR-015).
criterion = { workspace = true }

[[bench]]
name = "recompile_summary"
harness = false
